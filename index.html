<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --card:#ffffff; --ink:#14202b; --muted:#5d6b78; --line:#d5dce3; --accent:#14202b; --accent-ink:#ffffff;
  --blue:#1f6fe0; --orange:#f08a1c; --green:#2a9d5c; --brown:#8a5a3b; --slate:#6b7a8a; --white:#c9d1d9; --teal:#14a3b8; --danger:#c0392b;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#f1f4f7;--muted:#93a1ae;--line:#2a3743;--accent:#f1f4f7;--accent-ink:#0f161d;--white:#e6ebf0}
}
:root[data-theme="dark"]{--bg:#0f161d;--card:#18222c;--ink:#f1f4f7;--muted:#93a1ae;--line:#2a3743;--accent:#f1f4f7;--accent-ink:#0f161d;--white:#e6ebf0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 40px}
.total{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:12px 18px;margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.total small{display:block;font-size:15px;font-weight:500;opacity:.75}
.total .amount{font-size:52px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.total .meta{text-align:right;font-size:15px;font-weight:500;opacity:.75}
.tabs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:5px;margin-bottom:14px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:13px;font-weight:600;line-height:1.15;white-space:nowrap;cursor:pointer}
.tab .e{font-size:20px;line-height:1.1}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;gap:8px;margin-bottom:12px}
.field input{flex:1;min-width:0;padding:13px 14px;font-size:19px;font-weight:500;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.field .ghost{padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:16px;font-weight:600;cursor:pointer}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.types.t3{grid-template-columns:repeat(3,1fr);gap:6px}
.types.t3 .type{padding:10px 6px 10px 14px}
.types.t3 .type b{font-size:17px}
.type{position:relative;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 12px 11px 18px;color:var(--ink);cursor:pointer;overflow:hidden}
.type::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.type b{display:block;font-size:19px;font-weight:600}
.type span{color:var(--muted);font-size:15px}
.type[aria-pressed="true"]{border-color:var(--ink)}
.add{width:100%;padding:16px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
.add:disabled{opacity:.35}
.note{margin:10px 2px 0;font-size:15px;color:var(--muted)}
.note.warn{color:var(--orange)}
h3{margin:22px 2px 8px;font-size:18px;font-weight:600;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px}
.item{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 16px;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.item .n{font-size:19px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.item .t{font-size:15px;color:var(--muted)}
.item .p{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.del{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;min-width:40px;height:40px;font-size:18px;cursor:pointer;padding:0 8px}
.del.arm{background:var(--danger);border-color:var(--danger);color:#fff;font-size:15px;font-weight:600}
.empty{color:var(--muted);font-size:17px;padding:8px 2px}
.day{margin-bottom:12px}
.dayhead,.weekhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 6px}
.dayhead b,.weekhead b{font-size:19px;font-weight:600;text-transform:capitalize}
.dayhead span,.weekhead span{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.dayhead.zero b,.dayhead.zero span{color:var(--muted);font-weight:500}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:22px;cursor:pointer}
.nav b{font-size:21px;font-weight:600;text-transform:capitalize}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;padding:0 14px}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 0;min-height:52px}
summary::-webkit-details-marker{display:none}
summary .l b{display:block;font-size:19px;font-weight:600}
summary .l span{font-size:15px;color:var(--muted)}
summary .r{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
details.zero summary .r{color:var(--muted);font-weight:500}
details .list{padding-bottom:12px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* calendrier du mois */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.cal .dow{text-align:center;font-size:13px;font-weight:600;color:var(--muted);padding:2px 0}
.cal button{min-width:0;min-height:56px;padding:5px 2px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer}
.cal .dn{font-size:14px;font-weight:600;color:var(--muted)}
.cal .da{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;min-height:18px;white-space:nowrap}
.cal button.has{border-color:var(--ink);background:color-mix(in srgb,var(--green) 16%,var(--card))}
.cal button.has .dn{color:var(--ink)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--blue)}

.exp{display:block;width:100%;margin-top:16px;padding:15px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:18px;font-weight:600;cursor:pointer;transition:transform .08s ease}
.exp:active{transform:scale(.97)}

/* onglet cotisations */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.seg button{padding:10px 4px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);font-size:17px;font-weight:600;cursor:pointer;transition:transform .08s ease}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:active,.opt:active{transform:scale(.97)}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:8px}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:18px}
.crow:last-child{border-bottom:0}
.crow span i{font-style:normal;color:var(--muted);font-size:15px;margin-left:8px}
.crow b{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.crow.sub b{font-weight:600}
.crow.tot{font-size:19px}
.crow.net{font-size:23px}
.crow.net b{color:var(--green)}
.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;font-weight:600;cursor:pointer;transition:transform .08s ease}
.opt small{display:block;margin-top:2px;font-size:15px;font-weight:500;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:color-mix(in srgb,var(--green) 16%,var(--card))}
.gauge{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.gauge i{display:block;height:100%;border-radius:99px;animation:grow .5s ease}
@keyframes grow{from{width:0}}
.crow label{font-size:18px}
.rwrap{display:flex;align-items:center;gap:6px;white-space:nowrap}
.crow .rwrap i{margin:0;font-size:17px}
.rin{width:120px;padding:10px 12px;font-size:19px;font-weight:600;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:right}
.cnote{padding:0 0 6px;font-size:16px;color:var(--muted)}
.cnote p{margin:0 0 10px}
.cnote b{color:var(--ink)}

/* message "Enregistré" */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 104px);transform:translate(-50%,-12px) scale(.96);background:var(--green);color:#fff;padding:11px 20px;border-radius:999px;font-size:19px;font-weight:700;opacity:0;pointer-events:none;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .2s ease,transform .25s cubic-bezier(.2,1.4,.4,1);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.bad{background:var(--danger)}

/* animations (réponses aux actions) */
@keyframes slideIn{from{opacity:0;transform:translateY(-12px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(70px)}}
@keyframes bump{40%{transform:scale(1.07)}}
@keyframes pick{50%{transform:scale(1.04)}}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.item.new{animation:slideIn .35s cubic-bezier(.2,1.2,.4,1)}
.item.out{animation:slideOut .22s ease-in forwards}
.amount.bump{animation:bump .3s ease}
.type[aria-pressed="true"]{animation:pick .2s ease}
main.anim{animation:viewIn .22s ease-out}
.tab,.type,.add,.del,.ghost,.nav button,.cal button{transition:transform .08s ease}
.tab:active,.type:active,.add:active:not(:disabled),.del:active,.ghost:active,.nav button:active,.cal button:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="total" aria-live="polite">
    <div><small id="tl">Total</small><div class="amount" id="ta">0 €</div></div>
    <div class="meta" id="tm"></div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="jour"><span class="e">☀️</span>Jour</button>
    <button class="tab" role="tab" data-tab="semaine"><span class="e">📅</span>Semaine</button>
    <button class="tab" role="tab" data-tab="mois"><span class="e">🗓️</span>Mois</button>
    <button class="tab" role="tab" data-tab="cotis"><span class="e">🧾</span>Cotisations</button>
    <button class="tab" role="tab" data-tab="frais"><span class="e">⛽</span>Frais</button>
  </div>
  <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var TYPES=[
  {id:"aerien",e:"🪜",name:"Aérien",price:110,c:"var(--blue)"},
  {id:"souterrain",e:"⛏️",name:"Souterrain",price:90,c:"var(--orange)"},
  {id:"aero",e:"↕️",name:"Aéro-souterrain",price:100,c:"var(--green)"},
  {id:"facade",e:"🏠",name:"Façade",price:60,c:"var(--brown)"},
  {id:"immeuble",e:"🏢",name:"Immeuble",price:35,c:"var(--slate)"},
  {id:"sav",e:"🔧",name:"SAV",price:15,c:"var(--white)"},
  {id:"plp",e:"🔌",name:"PLP",price:20,c:"var(--teal)"}
];
var TM={};TYPES.forEach(function(t){TM[t.id]=t});
var KEY="ma-journee-fibre-v2";
var items=[];
try{var raw=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(raw))items=raw}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}

function pad(n){return (n<10?"0":"")+n}
function ymdOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2],12)}
function today(){return ymdOf(new Date())}
function mondayKey(s){var d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymdOf(d)}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymdOf(d)}
function lbl(s,o){return parse(s).toLocaleDateString("fr-FR",o)}
function eur(v){return v.toLocaleString("fr-FR")+" €"}
function sum(l){return l.reduce(function(a,i){return a+i.p},0)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function plural(n){return n+" intervention"+(n>1?"s":"")}

var S={tab:"jour",date:today(),type:null,num:"",msg:"",warn:false,del:null,newId:null,anim:false,mY:new Date().getFullYear(),mM:new Date().getMonth(),cP:"m",cY:new Date().getFullYear(),cM:new Date().getMonth(),open:{}};

function itemHTML(i,withDel){
  var t=TM[i.t]||{name:i.t,c:"var(--slate)"};
  return '<div class="item'+(i.id===S.newId?' new':'')+'" style="--c:'+t.c+'"><div class="n">'+esc(i.n)+'<div class="t">'+(t.e?t.e+' ':'')+t.name+'</div></div><div class="p">'+eur(i.p)+'</div>'+
    (withDel?'<button class="del'+(S.del===i.id?' arm':'')+'" data-act="del" data-id="'+i.id+'" aria-label="Supprimer">'+(S.del===i.id?'Supprimer ?':'✕')+'</button>':'')+'</div>';
}
function listHTML(l,withDel){
  if(!l.length)return '<div class="empty">Rien de saisi.</div>';
  return '<div class="list">'+l.slice().reverse().map(function(i){return itemHTML(i,withDel)}).join("")+'</div>';
}
function setBanner(label,total,meta){
  document.getElementById("tl").textContent=label;
  document.getElementById("ta").textContent=eur(total);
  document.getElementById("tm").textContent=meta;
}

function viewJour(){
  var l=items.filter(function(i){return i.d===S.date});
  var isToday=S.date===today();
  setBanner(isToday?"Total d'aujourd'hui":"Total du "+lbl(S.date,{day:"numeric",month:"long"}),sum(l),plural(l.length));
  var types=TYPES.map(function(t){
    return '<button class="type" style="--c:'+t.c+'" data-act="type" data-id="'+t.id+'" aria-pressed="'+(S.type===t.id)+'"><b>'+(t.e?t.e+' ':'')+t.name+'</b><span>'+t.price+' €</span></button>';
  }).join("");
  return '<div class="field"><input type="date" id="dt" value="'+S.date+'" aria-label="Date">'+(isToday?'':'<button class="ghost" data-act="now">Aujourd\'hui</button>')+'</div>'+
    '<div class="types">'+types+'</div>'+
    '<div class="field"><input type="text" id="num" value="'+esc(S.num)+'" placeholder="N° d\'intervention" autocomplete="off" enterkeyhint="done"></div>'+
    '<button class="add" id="add" data-act="add"'+(S.type&&S.num.trim()?'':' disabled')+'>Ajouter</button>'+
    (S.msg?'<div class="note'+(S.warn?' warn':'')+'">'+esc(S.msg)+'</div>':'')+
    '<h3>Interventions du jour</h3>'+listHTML(l,true);
}

function viewSemaine(){

  h+='<h3>ℹ️ Infos</h3><details data-wk="cotis-info"'+(S.open["cotis-info"]?' open':'')+'><summary><div class="l"><b>Comment c\'est calculé ?</b></div></summary><div class="cnote">'+
    '<p><b>Cotisations = chiffre d\'affaires × taux.</b> Aucune charge n\'est déduite : tu paies sur ce que tu encaisses.</p>'+
    '<p>Taux officiels 2026 pour une prestation de services artisanale (BIC) : 21,2 % de cotisations + 0,3 % de formation professionnelle (0,1 % si tu n\'es pas inscrit à la Chambre des métiers). Tu peux les changer avec le bouton ✏️.</p>'+
    '<p>Les 21,2 % couvrent la maladie, la retraite, les allocations familiales, l\'invalidité-décès et la CSG-CRDS.</p>'+
    '<p><b>Attention :</b> l\'URSSAF compte ce que tu <b>encaisses</b> (date du paiement), pas la date de l\'intervention. Ici, tout est compté à la date de l\'intervention : si une facture est payée le mois suivant, décale-la dans ta tête.</p>'+
    '<p>Tu dois déclarer ton CA sur autoentrepreneur.urssaf.fr à chaque échéance (mensuelle ou trimestrielle), même s\'il est à 0 €.</p>'+
    '<p>Ce calcul est une estimation, pas un conseil comptable. Pour un montant exact, vérifie sur autoentrepreneur.urssaf.fr ou avec un comptable.</p>'+
  '</div></details>';
  return h;
}

function expHTML(x){
  var k=FM[x.k];
  return '<div class="item'+(x.id===S.fNew?' new':'')+'" style="--c:'+k.c+'"><div class="n">'+k.e+' '+k.name+'<div class="t">'+lbl(x.d,{weekday:"short",day:"numeric",month:"short"})+'</div></div><div class="p">'+(k.inc?'+ ':'− ')+eur2(x.a)+'</div>'+
    '<button class="del'+(S.fDel===x.id?' arm':'')+'" data-act="fdel" data-id="'+x.id+'" aria-label="Supprimer">'+(S.fDel===x.id?'Supprimer ?':'✕')+'</button></div>';
}
function viewFrais(){
  var r=mRange(S.fY,S.fM),l=expIn(r.from,r.to).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
  var ca=sum(items.filter(function(i){return i.d>=r.from&&i.d<=r.to})),gas=sumA(expIn(r.from,r.to,"gasoil")),rep=sumA(expIn(r.from,r.to,"repas")),tip=sumA(expIn(r.from,r.to,"pourboire"));
  var c=calc(r2(ca+(cfg.tips?tip:0))),reste=r2(ca+tip-c.tot-gas-rep);
  setBanner("Reste réel · "+r.label,Math.round(reste),l.length+" note"+(l.length>1?"s":""));
  var isT=S.fDate===today(),ok=!!S.fType&&!isNaN(amt(S.fNum));
  var h='<div class="field"><input type="date" id="fdt" value="'+S.fDate+'" aria-label="Date">'+(isT?'':'<button class="ghost" data-act="fnow">Aujourd\'hui</button>')+'</div>'+
    '<div class="types t3">'+FK.map(function(k){
      return '<button class="type" style="--c:'+k.c+'" data-act="ftype" data-id="'+k.id+'" aria-pressed="'+(S.fType===k.id)+'"><b>'+k.e+' '+k.name+'</b><span>'+k.sub+'</span></button>';
    }).join("")+'</div>'+
    '<div class="field"><input type="text" id="fnum" inputmode="decimal" value="'+esc(S.fNum)+'" placeholder="Montant en €" autocomplete="off" enterkeyhint="done"></div>'+
    '<button class="add" id="fadd" data-act="fadd"'+(ok?'':' disabled')+'>Ajouter</button>';
  h+='<h3>📊 Bilan du mois</h3><div class="nav"><button data-act="fprev" aria-label="Mois précédent">‹</button><b>'+r.label+'</b><button data-act="fnext" aria-label="Mois suivant">›</button></div>'+
    '<div class="cbox">'+
      '<div class="crow"><span>🛠️ Interventions</span><b>'+eur2(ca)+'</b></div>'+
      '<div class="crow sub"><span>💶 Pourboires reçus</span><b>+ '+eur2(tip)+'</b></div>'+
      '<div class="crow sub"><span>🏛️ Cotisations estimées</span><b>− '+eur2(c.tot)+'</b></div>'+
      '<div class="crow sub"><span>⛽ Gasoil</span><b>− '+eur2(gas)+'</b></div>'+
      '<div class="crow sub"><span>🍽️ Repas</span><b>− '+eur2(rep)+'</b></div>'+
      '<div class="crow net"><span>✅ Reste réel</span><b>'+eur2(reste)+'</b></div>'+
    '</div>'+
    '<div class="note">💡 Les frais ne baissent pas tes cotisations : en micro-entreprise, elles se calculent sur le CA, sans déduire les dépenses. Ici, ils servent à voir ce qu\'il te reste vraiment. Les cotisations suivent tes réglages de l\'onglet Cotisations.</div>';
  h+='<h3>🧾 Notes du mois</h3>'+(l.length?'<div class="list">'+l.map(expHTML).join("")+'</div>':'<div class="empty">Aucune note ce mois-ci.</div>');
  h+='<h3>💶 Pourboires et cotisations</h3>'+
    opt("tips","1",cfg.tips,"Les compter dans le CA","Cotisations calculées aussi sur les pourboires (prudent)")+
    opt("tips","0",!cfg.tips,"Ne pas les compter","Les pourboires restent hors du calcul des cotisations")+
    '<div class="note">En principe, les pourboires reçus pour ton activité font partie du CA à déclarer. À vérifier avec l\'URSSAF ou un comptable.</div>';
  return h;
}
function doAddF(){
  var a=amt(S.fNum);if(!S.fType||isNaN(a))return;
  var id=Date.now();
  exps.push({id:id,k:S.fType,d:S.fDate,a:r2(a)});
  saveF();buzz();S.fNew=id;S.fNum="";S.fDel=null;
  S.fY=+S.fDate.slice(0,4);S.fM=+S.fDate.slice(5,7)-1;
  render();bump();toast("✓ Enregistré");
  var inp=document.getElementById("fnum");if(inp)inp.focus();
}

function render(){
  document.querySelectorAll(".tab").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===S.tab)});
  var main=document.getElementById("main");
  main.classList.remove("anim");
  main.innerHTML=S.tab==="jour"?viewJour():S.tab==="semaine"?viewSemaine():S.tab==="cotis"?viewCotis():S.tab==="frais"?viewFrais():viewMois();
  if(S.anim){void main.offsetWidth;main.classList.add("anim");S.anim=false}
  S.newId=null;S.fNew=null;
}
var toastT;
function toast(msg,bad){
  var t=document.getElementById("toast");
  t.textContent=msg;t.classList.toggle("bad",!!bad);t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show")},1600);
}
function bump(){
  var a=document.getElementById("ta");a.classList.remove("bump");void a.offsetWidth;a.classList.add("bump");
}

function buzz(){try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}}

document.querySelector(".tabs").addEventListener("click",function(e){
  var b=e.target.closest(".tab");if(!b)return;S.tab=b.dataset.tab;S.del=null;S.fDel=null;S.anim=true;render();
});
var main=document.getElementById("main");
main.addEventListener("input",function(e){
  if(e.target.id==="fnum"){S.fNum=e.target.value;var fa=document.getElementById("fadd");if(fa)fa.disabled=!(S.fType&&!isNaN(amt(S.fNum)))}
  if(e.target.id==="num"){
    S.num=e.target.value;S.msg="";
    var a=document.getElementById("add");if(a)a.disabled=!(S.type&&S.num.trim());
  }
});
main.addEventListener("change",function(e){
  if(e.target.id==="fdt"&&e.target.value){S.fDate=e.target.value;S.fDel=null;render()}
  if(e.target.id==="dt"&&e.target.value){S.date=e.target.value;S.msg="";S.del=null;render()}
});
main.addEventListener("toggle",function(e){
  var w=e.target.dataset&&e.target.dataset.wk;if(w)S.open[w]=e.target.open;
},true);
main.addEventListener("keydown",function(e){
  if(e.target.id==="fnum"&&e.key==="Enter"){e.preventDefault();doAddF()}
  if(e.target.id==="num"&&e.key==="Enter"){e.preventDefault();doAdd()}
});
main.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if(a==="type"){S.type=b.dataset.id;S.msg="";render()}
  else if(a==="now"){S.date=today();render()}
  else if(a==="add"){doAdd()}
  else if(a==="del"){
    var id=+b.dataset.id;
    if(S.del===id){
      var row=b.closest(".item");
      if(row){if(row.classList.contains("out"))return;row.classList.add("out")}
      setTimeout(function(){
        items=items.filter(function(i){return i.id!==id});
        S.del=null;save();buzz();render();bump();toast("Supprimé",true);
      },row?220:0);
    }else{S.del=id;render()}
  }
  else if(a==="cper"){S.cP=b.dataset.p;render()}
  else if(a==="cprev"||a==="cnext"){
    var dl=a==="cnext"?1:-1;
    if(S.cP==="m")S.cM+=dl;else if(S.cP==="t")S.cM+=3*dl;else S.cY+=dl;
    if(S.cM<0){S.cM+=12;S.cY--}else if(S.cM>11){S.cM-=12;S.cY++}
    render();
  }
  else if(a==="cedit"){S.cEdit=!S.cEdit;render()}
  else if(a==="csave"){saveRates()}
  else if(a==="creset"){cfg.rates={rate:DEF.rate,cfp:DEF.cfp,vl:DEF.vl,plafond:DEF.plafond};saveCfg();S.cEdit=false;render();toast("↩️ Taux 2026 remis")}
  else if(a==="tips"){cfg.tips=b.dataset.v==="1";saveCfg();render()}
  else if(a==="ftype"){S.fType=b.dataset.id;render()}
  else if(a==="fnow"){S.fDate=today();render()}
  else if(a==="fadd"){doAddF()}
  else if(a==="fprev"||a==="fnext"){
    S.fM+=a==="fnext"?1:-1;
    if(S.fM<0){S.fM=11;S.fY--}else if(S.fM>11){S.fM=0;S.fY++}
    render();
  }
  else if(a==="fdel"){
    var fid=+b.dataset.id;
    if(S.fDel===fid){
      var frow=b.closest(".item");
      if(frow){if(frow.classList.contains("out"))return;frow.classList.add("out")}
      setTimeout(function(){exps=exps.filter(function(x){return x.id!==fid});S.fDel=null;saveF();buzz();render();bump();toast("Supprimé",true)},frow?220:0);
    }else{S.fDel=fid;render()}
  }
  else if(a==="acre"){cfg.acre=+b.dataset.v;saveCfg();render()}
  else if(a==="vl"){cfg.vl=b.dataset.v==="1";saveCfg();render()}
  else if(a==="export"){exportPDF()}
  else if(a==="goday"){S.date=b.dataset.d;S.tab="jour";S.msg="";S.del=null;S.anim=true;render();window.scrollTo(0,0)}
  else if(a==="prev"||a==="next"){
    S.mM+=a==="next"?1:-1;
    if(S.mM<0){S.mM=11;S.mY--}else if(S.mM>11){S.mM=0;S.mY++}
    S.anim=true;render();
  }
});
function doAdd(){
  var n=S.num.trim();if(!S.type||!n)return;
  var dup=items.filter(function(i){return i.n.toLowerCase()===n.toLowerCase()})[0];
  var nid=Date.now();
  items.push({id:nid,n:n,t:S.type,d:S.date,p:TM[S.type].price});
  save();buzz();S.newId=nid;
  S.num="";S.del=null;
  S.warn=!!dup;
  S.msg=dup?"N° "+n+" déjà saisi le "+lbl(dup.d,{day:"numeric",month:"long"})+". Ajouté quand même.":"N° "+n+" ajouté.";
  render();bump();toast("✓ Enregistré");
  var inp=document.getElementById("num");if(inp)inp.focus();
}
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){if(S.tab==="jour"&&S.date<today()&&false){}render()}
});
render();
</script>
</body>
</html>
